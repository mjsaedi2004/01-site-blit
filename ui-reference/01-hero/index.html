<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- artifact:start -->
<title>نسخه‌های هیروی بلیت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
/* One page to compare every hero version: a thin bar of tabs on top, the chosen version below.
   Each version is its own page in v1/ … v6/. The bar is deliberately neutral so it doesn't
   colour the comparison. */
:root {
  --bar: #0b0a0e;
  --bar-line: rgba(255, 255, 255, .1);
  --fg: #f4f1f8;
  --fg-2: rgba(244, 241, 248, .66);
  --fg-3: rgba(244, 241, 248, .44);
  --hi: #f4f1f8;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; }
body { background: var(--bar); color: var(--fg); font-family: "Vazirmatn", Tahoma, system-ui, sans-serif; font-size: 14px; }
.shell { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.bar { display: flex; align-items: center; gap: 18px; min-height: 52px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--bar-line); }
.bar h1 { margin: 0; font-size: 14px; font-weight: 700; white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-inline: auto; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { all: unset; cursor: pointer; position: relative; display: inline-flex; align-items: baseline; gap: 8px; padding: 8px 14px; border-radius: 999px; color: var(--fg-2); white-space: nowrap; transition: color .25s, background .25s; }
.tab b { font-weight: 700; color: var(--fg); }
.tab small { font-size: 12.5px; }
.tab:hover { color: var(--fg); background: rgba(255, 255, 255, .06); }
.tab[aria-selected="true"] { background: var(--hi); color: var(--bar); }
.tab[aria-selected="true"] b { color: var(--bar); }
.tab:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
.tab .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; opacity: .7; }
.side { display: flex; align-items: center; gap: 14px; white-space: nowrap; color: var(--fg-3); font-size: 12.5px; }
.side a { color: var(--fg-2); text-decoration: none; border-bottom: 1px solid var(--bar-line); }
.side a:hover { color: var(--fg); border-color: var(--fg-2); }
.keys { direction: ltr; unicode-bidi: isolate; }
.view { position: relative; min-height: 0; background: #000; }
.view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-3); pointer-events: none; transition: opacity .3s; }
.view.is-ready .loading { opacity: 0; }
@media (max-width: 900px) {
  .bar { flex-wrap: wrap; gap: 8px; }
  .bar h1 { flex: 1; }
  .tabs { order: 3; width: 100%; margin: 0; }
  .tab small, .keys { display: none; }
}
</style>

<div class="shell">
  <header class="bar">
    <h1>هیروی بلیت · مقایسه‌ی نسخه‌ها</h1>
    <nav class="tabs" role="tablist" aria-label="نسخه‌ها">
      <button type="button" class="tab" role="tab" data-v="v1" aria-selected="false"><b>۱</b><small>نسخه‌ی اول · صحنه‌ی WebGL و دسته‌ی بلیت</small></button>
      <button type="button" class="tab" role="tab" data-v="v2" aria-selected="false"><b>۲</b><small>عکس و جایگاه ویژه</small><span class="tag">نگه‌داشته</span></button>
      <button type="button" class="tab" role="tab" data-v="v3" aria-selected="false"><b>۳</b><small>پوستر گرافیکی</small></button>
      <button type="button" class="tab" role="tab" data-v="v4" aria-selected="false"><b>۴</b><small>رسمی و زنده</small></button>
      <button type="button" class="tab" role="tab" data-v="v5" aria-selected="false"><b>۵</b><small>صحنه و هاله، از روی نمونه‌ها</small><span class="tag">پسندیده</span></button>
      <button type="button" class="tab" role="tab" data-v="v6" aria-selected="false"><b>۶</b><small>پوستر، بنر یا عکس · پنل مدیریت</small><span class="tag">تازه</span></button>
    </nav>
    <span class="side"><span class="keys">1 – 6</span><a id="openAlone" href="v6/index.html" target="_blank" rel="noopener">باز کردن جدا</a></span>
  </header>
  <main class="view" id="view">
    <div class="loading" aria-hidden="true">در حال بارگذاری…</div>
    <iframe id="frame" title="نسخه‌ی انتخاب‌شده" allow="autoplay; fullscreen"></iframe>
  </main>
</div>

<script>
(() => {
  const tabs = [...document.querySelectorAll('.tab')], frame = document.getElementById('frame'), view = document.getElementById('view'), alone = document.getElementById('openAlone');
  const ids = tabs.map((t) => t.dataset.v);
  const show = (v, push = true) => {
    if (!ids.includes(v)) v = 'v6';
    tabs.forEach((t) => { const on = t.dataset.v === v; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; });
    const src = `${v}/index.html`;
    if (frame.getAttribute('src') !== src) { view.classList.remove('is-ready'); frame.setAttribute('src', src); }
    alone.href = src;
    if (push && location.hash !== '#' + v) { try { history.replaceState(null, '', '#' + v); } catch (e) { location.hash = v; } }
  };
  frame.addEventListener('load', () => view.classList.add('is-ready'));
  tabs.forEach((t) => t.addEventListener('click', () => show(t.dataset.v)));
  document.querySelector('.tabs').addEventListener('keydown', (e) => {
    const i = ids.indexOf(tabs.find((t) => t.getAttribute('aria-selected') === 'true').dataset.v);
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(ids[(i + 1) % ids.length]); tabs[(i + 1) % ids.length].focus(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); show(ids[(i - 1 + ids.length) % ids.length]); tabs[(i - 1 + ids.length) % ids.length].focus(); }
  });
  document.addEventListener('keydown', (e) => { if (/^[1-6]$/.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey) show('v' + e.key); });
  window.addEventListener('hashchange', () => show(location.hash.slice(1), false));
  show(location.hash.slice(1) || 'v6', false);
})();
</script>
<!-- artifact:end -->
</html>
